<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Navbar -->
    <header class="nav-wrapped">
      <nav class="nav-card">
        <a href="#profil">Profil</a>
        <a href="#input-data">Input Nilai</a>
        <a href="#daftar-mahasiswa">Daftar Mahasiswa</a>
      </nav>
    </header>

    <!-- Profil -->
    <main class="main-profil" id="profil">
      <section class="profil">
        <div class="img-box">
          <img src="./src/ali.jpeg" alt="foto profile" width="150px" />
        </div>
        <div class="profil-card">
          <h3>Nur Muhammad Ali</h3>
          <div class="profil-info">
            <p>
              NIM: <strong>47125059</strong> <span> </span> Teknik Informatika
              dan Komputer (D4)
            </p>
          </div>
        </div>
      </section>
    </main>

    <!-- Input nilai -->
    <section class="main-input" id="input-data">
      <h2>Input Data</h2>
      <form id="form-mahasiswa">
        <div class="input-group">
          <label for="nama">Nama Lengkap</label>
          <input
            type="text"
            name="nama"
            id="nama"
            placeholder="Nama lengkap"
            required
          />
        </div>

        <div class="input-group">
          <label for="nim">NIM</label>
          <input
            type="text"
            name="nim"
            id="nim"
            placeholder="NIM"
            required
          />
        </div>

        <div class="input-group">
          <label for="prodi">Program Studi</label>
          <select name="prodi" id="prodi" required>
            <option value="" disabled selected>Pilih Program Studi</option>
            <option value="Teknik Komputer dan Jaringan">
              Teknik Komputer dan Jaringan(D4)
            </option>
            <option value="Teknik Multimedia dan Jaringan">
              Teknik Multimedia dan Jaringan(D4)
            </option>
          </select>
        </div>

        <div class="nilai-row">
          <div class="input-group">
            <label for="nilai-tugas">Tugas</label>
            <input
              type="number"
              id="nilai-tugas"
              name="nilai-tugas"
              min="0"
              max="100"
              step="0.1"
              placeholder="0"
              required
            />
          </div>

          <div class="input-group">
            <label for="nilai-uts">UTS</label>
            <input
              type="number"
              id="nilai-uts"
              name="nilai-uts"
              min="0"
              max="100"
              step="0.1"
              placeholder="0"
              required
            />
          </div>

          <div class="input-group">
            <label for="nilai-uas">UAS</label>
            <input
              type="number"
              id="nilai-uas"
              name="nilai-uas"
              min="0"
              max="100"
              step="0.1"
              placeholder="0"
              required
            />
          </div>
        </div>

        <div class="btn-hitung">
          <button type="submit" id="btn-summit">Simpan</button>
          <button type="reset" id="btn-reset">Reset</button>
        </div>
      </form>
    </section>

    <!-- daftar mahasiswa -->
    <section class="main-daftar" id="daftar-mahasiswa">
      <div class="daftar-header">
        <div>
          <h2>Daftar Mahasiswa</h2>
          <p class="subtitle">
             status kelulusan
          </p>
        </div>
        <span class="total-badge" id="badge-total">Total: 0 Mahasiswa</span>
      </div>

      <div class="table-responsive">
        <table class="tabel-mahasiswa">
          <thead>
            <tr>
              <th>NIM</th>
              <th>Nama</th>
              <th>Program Studi</th>
              <th>Tugas</th>
              <th>UTS</th>
              <th>UAS</th>
              <th>Nilai Akhir</th>
              <th>Grade</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="tabel-body">
            <tr class="row-empty">
              <td colspan="9">Belum ada data mahasiswa yang tersimpan.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <script src="./js/main.js"></script>
  </body>
</html>
